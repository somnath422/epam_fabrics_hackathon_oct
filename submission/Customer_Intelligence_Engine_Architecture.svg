  <text x="412" y="789" class="body">Retention action record</text>
  <text x="412" y="815" class="small">Auditable event-to-action link</text>

  <rect x="710" y="668" width="310" height="170" class="box" fill="#edf7e6"/>
  <text x="732" y="706" class="label">Retention alert</text>
  <text x="732" y="737" class="body">Account, ARR, risk score</text>
  <text x="732" y="763" class="body">Drivers and recommended play</text>
  <text x="732" y="789" class="body">Teams/email/CRM handoff</text>
  <text x="732" y="815" class="small">The system acts, not just reports</text>

  <path d="M1000 585 L1000 648 L205 648 L205 668" class="arrow"/>
  <path d="M340 753 L390 753" class="arrow"/>
  <path d="M660 753 L710 753" class="arrow"/>

