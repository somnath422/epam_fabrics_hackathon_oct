  <text x="92" y="763" class="body">High / Medium / Low</text>
  <text x="92" y="789" class="body">Top SHAP drivers</text>
  <text x="92" y="815" class="small">ARR at risk = ARR x probability</text>

  <rect x="390" y="668" width="270" height="170" class="box" fill="#edf7e6"/>
