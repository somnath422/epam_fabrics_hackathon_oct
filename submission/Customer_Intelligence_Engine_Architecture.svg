  <path d="M1020 753 L1100 620" class="arrow"/>
  <path d="M1020 490 L1100 530" class="arrow"/>

  <rect x="70" y="900" width="1440" height="42" rx="8" fill="#092f3d"/>
  <text x="95" y="927" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">Demo moment: replay recorded history → score climbs → threshold crossed → explainable alert, ~90 days before the true cancel date</text>
