  <rect x="1100" y="400" width="410" height="438" class="box" fill="#ffffff"/>
  <text x="1130" y="445" class="label">Power BI retention workspace</text>
  <line x1="1130" y1="469" x2="1480" y2="469" stroke="#d7e3e4" stroke-width="2"/>
  <text x="1130" y="510" class="body">Executive overview, ARR at risk</text>
  <text x="1130" y="545" class="body">High-risk account workbench</text>
  <text x="1130" y="580" class="body">Account 360 with 2-year history</text>
  <text x="1130" y="615" class="body">Risk drivers and actions</text>
