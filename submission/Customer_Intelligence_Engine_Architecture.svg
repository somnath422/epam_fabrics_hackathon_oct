<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#0b5563"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#082f3a" flood-opacity="0.14"/></filter>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #092f3d; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #53666c; }
      .section { font: 700 15px Arial, sans-serif; letter-spacing: 1.2px; fill: #0b5563; }
      .label { font: 700 18px Arial, sans-serif; fill: #092f3d; }
      .body { font: 400 15px Arial, sans-serif; fill: #29454d; }
      .small { font: 400 13px Arial, sans-serif; fill: #53666c; }
      .box { stroke: #c5d7d9; stroke-width: 2; rx: 12; filter: url(#shadow); }
      .arrow { stroke: #0b5563; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="980" fill="#f7fbfa"/>
  <rect x="0" y="0" width="1600" height="14" fill="#0b8f9c"/>
  <text x="70" y="74" class="title">Customer Intelligence Engine</text>
  <text x="70" y="107" class="subtitle">90-day explainable churn early warning for B2B SaaS | EPAM Fabricators | Microsoft Fabric</text>

  <text x="70" y="163" class="section">SOURCE AND INGESTION</text>
  <rect x="70" y="185" width="270" height="135" class="box" fill="#e8f5f3"/>
  <text x="92" y="222" class="label">Source dataset</text>
  <text x="92" y="251" class="body">10,000 B2B SaaS accounts</text>
  <text x="92" y="275" class="body">730 daily snapshots</text>
  <text x="92" y="299" class="body">6.67M rows, 41 columns</text>

  <rect x="390" y="185" width="270" height="135" class="box" fill="#e8f5f3"/>
  <text x="412" y="222" class="label">Fabric Lakehouse</text>
  <text x="412" y="251" class="body">CSV upload to OneLake Files</text>
  <text x="412" y="275" class="body">Notebook-driven Spark ETL</text>
  <text x="412" y="299" class="body">No Data Factory pipeline</text>

  <path d="M340 252 L390 252" class="arrow"/>

  <text x="70" y="360" class="section">DATA FOUNDATION AND INTELLIGENCE</text>
  <rect x="70" y="400" width="270" height="185" class="box" fill="#fff7e2"/>
  <text x="92" y="438" class="label">Lakehouse medallion</text>
  <text x="92" y="469" class="body">Bronze: master CSV by date</text>
  <text x="92" y="495" class="body">Silver: entity shred</text>
  <text x="92" y="521" class="body">Gold: Customer 360</text>
  <text x="92" y="555" class="small">Account, Subscription, Usage, Support</text>

  <rect x="390" y="400" width="270" height="185" class="box" fill="#fff7e2"/>
  <text x="412" y="438" class="label">Eventstream → Eventhouse</text>
  <text x="412" y="469" class="body">Seven saved risk-score events</text>
  <text x="412" y="495" class="body">Typed KQL event table</text>
  <text x="412" y="521" class="body">Historical replay, not live usage</text>
  <text x="412" y="555" class="small">No KQL journey queries demonstrated</text>

  <rect x="710" y="400" width="310" height="185" class="box" fill="#e9effb"/>
  <text x="732" y="438" class="label">Data Science notebook</text>
  <text x="732" y="469" class="body">13 allowlisted features</text>
  <text x="732" y="495" class="body">Logistic regression</text>
  <text x="732" y="521" class="body">Signed coefficient contributions</text>
  <text x="732" y="555" class="small">Account- and time-disjoint test</text>

  <path d="M525 320 L525 355 L205 355 L205 400" class="arrow"/>
  <path d="M205 585 L205 610 L730 610 L730 585" class="arrow"/>

  <text x="70" y="628" class="section">SCORE, EXPLAIN, ACT</text>
  <rect x="70" y="668" width="270" height="170" class="box" fill="#e9effb"/>
  <text x="92" y="706" class="label">Risk scoring</text>
  <text x="92" y="737" class="body">Churn-within-90d score</text>
  <text x="92" y="763" class="body">High / Medium / Low bands</text>
  <text x="92" y="789" class="body">Full signed contributions</text>
  <text x="92" y="815" class="small">ARR x score = prioritisation proxy</text>

  <rect x="390" y="668" width="270" height="170" class="box" fill="#edf7e6"/>
  <text x="412" y="706" class="label">Activator</text>
  <text x="412" y="737" class="body">Event rule: score >= 0.05</text>
  <text x="412" y="763" class="body">Validating notebook handler</text>
  <text x="412" y="789" class="body">Insert-only review task</text>
  <text x="412" y="815" class="small">Historical event-to-task proof</text>

  <rect x="710" y="668" width="310" height="170" class="box" fill="#edf7e6"/>
  <text x="732" y="706" class="label">Retention review task</text>
  <text x="732" y="737" class="body">Account, score, owner, status</text>
  <text x="732" y="763" class="body">Driver and suggested human play</text>
  <text x="732" y="789" class="body">Visible in Power BI task register</text>
  <text x="732" y="815" class="small">Notification not attempted</text>

  <path d="M1000 585 L1000 648 L205 648 L205 668" class="arrow"/>
  <path d="M340 753 L355 753 L355 610 L525 610 L525 585" class="arrow"/>
  <path d="M525 585 L525 668" class="arrow"/>
  <path d="M660 753 L710 753" class="arrow"/>

  <text x="1100" y="360" class="section">BUSINESS EXPERIENCE</text>
  <rect x="1100" y="400" width="410" height="438" class="box" fill="#ffffff"/>
  <text x="1130" y="445" class="label">Three-page Power BI report</text>
  <line x1="1130" y1="469" x2="1480" y2="469" stroke="#d7e3e4" stroke-width="2"/>
  <text x="1130" y="510" class="body">Sep 30: 55 High / 5 Medium</text>
  <text x="1130" y="545" class="body">1,582 / 7,982 scored (19.82%)</text>
  <text x="1130" y="580" class="body">Account score and model signals</text>
  <text x="1130" y="615" class="body">Retention task register</text>
  <text x="1130" y="665" class="small">Business question:</text>
  <text x="1130" y="698" class="body">Which accounts should we work today,</text>
  <text x="1130" y="726" class="body">why are they at risk, and</text>
  <text x="1130" y="754" class="body">what should we do next?</text>
  <text x="1130" y="803" class="small">Direct Lake mode not verified</text>

  <path d="M1020 753 L1100 620" class="arrow"/>

  <rect x="70" y="890" width="1440" height="70" rx="8" fill="#092f3d"/>
  <text x="95" y="917" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">PROOF: July 15 Low → August 1 High historical score replay; Activator created one human-review task. No notification was attempted.</text>
  <text x="95" y="944" font-family="Arial, sans-serif" font-size="13" fill="#d9e7ea">NOT BUILT / UNVERIFIED: Fabric IQ ontology, multi-source identity matching, KQL journeys, Copilot Studio, Purview labels, Direct Lake mode.</text>
</svg>
